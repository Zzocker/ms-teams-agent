name: build

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, os: ubuntu-22.04, arch: x86_64, bin: ms-teams-agent }
          - { name: arch, os: ubuntu-latest, arch: x86_64, container: "archlinux:latest", bin: ms-teams-agent }
          - { name: windows, os: windows-latest, arch: x86_64, bin: ms-teams-agent.exe }
          - { name: macos, os: macos-15, arch: aarch64, bin: ms-teams-agent }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - if: matrix.name == 'arch'
        run: pacman -Syu --noconfirm --needed base-devel git rustup python libxkbcommon wayland fontconfig vulkan-icd-loader && rustup default stable
      - if: matrix.name == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v4
      - if: matrix.name != 'arch'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.name != 'arch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: python3 -m unittest discover -s scripts -p test_package.py
      - run: python3 scripts/package.py ${{ matrix.name }} ${{ matrix.arch }} target/release/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/release'
    needs: build
    concurrency:
      group: create-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read release version
        id: version
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("Cargo.toml", "rb") as stream:
              version = tomllib.load(stream)["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"tag=v{version}\n")
          PYTHON
      - name: Tag the tested commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already belongs to another commit. Bump the version in Cargo.toml."
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create complete draft preview release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --generate-notes ./*.tar.gz ./*.zip SHA256SUMS
