[package]
name = "ms-teams-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

[features]
default = ["image", "markdown"]
# Show pictures in messages (pasted screenshots, image files). Off: they show as "[image]".
image = []
# Format Markdown in messages (bold, italic, code, lists, headings). Off: shown as typed.
markdown = ["dep:pulldown-cmark"]

# Rune's own patches; a dependency's [patch] doesn't reach us (rune README, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
