[package]
name = "ms-teams-agent"
version = "1.3.3"
edition = "2024"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6", features = ["native-file-dialog"] }
serde_json = "1"
semver = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
png = { version = "0.18", optional = true }
base64 = "0.22"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-sdp = { version = "0.25", optional = true }
gstreamer-webrtc = { version = "0.25", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "6"
futures-lite = "2"

[features]
default = ["image", "markdown", "call-audio"]
# Show pictures in messages (pasted screenshots, image files). Off: they show as "[image]".
image = ["dep:png"]
# Format Markdown in messages (bold, italic, code, lists, headings). Off: shown as typed.
markdown = ["dep:pulldown-cmark"]
# Enable experimental outgoing Teams audio calls.
call-audio = ["dep:gstreamer", "dep:gstreamer-sdp", "dep:gstreamer-webrtc"]

# Rune's own patches; a dependency's [patch] doesn't reach us (rune README, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
