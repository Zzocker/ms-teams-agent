<style>
#teams-analytics {
  color-scheme: light dark;
  --paper: light-dark(#e9e7fb, #252344);
  --panel: light-dark(#f4eeff, #302a53);
  --ink: light-dark(#32265c, #ede0ff);
  --muted: light-dark(#54457c, #cbbde8);
  --rule: light-dark(#8771af, #8370a9);
  --dot: #8971b859;
  --accent: light-dark(#6245a3, #bea4ff);
  accent-color: var(--accent);
  font: 14px/1.45 Inter, system-ui, sans-serif;
  color: var(--ink); background: var(--paper);
}
#teams-analytics * { box-sizing: border-box; }
#teams-analytics [hidden] { display: none !important; }
#teams-analytics .app-header, #teams-analytics .toolbar, #teams-analytics .graph-tools {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
}
#teams-analytics .app-header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
#teams-analytics .app-name { font-weight: 650; flex: 1; }
#teams-analytics .app-search { flex: 2; color: var(--muted); padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; }
#teams-analytics .avatar { border: 1px solid var(--rule); border-radius: 50%; padding: 5px; font-size: 12px; }
#teams-analytics .app-body { display: grid; grid-template-columns: 62px minmax(0, 1fr); }
#teams-analytics .rail { background: var(--panel); border-right: 1px solid var(--rule); padding: 8px 4px; }
#teams-analytics .rail-item {
  display: grid; justify-items: center; gap: 3px; padding: 8px 0;
  border-radius: 8px; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 600;
}
#teams-analytics .rail-item[aria-current] { color: var(--accent); outline: 1px solid var(--accent); outline-offset: -1px; }
#teams-analytics :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#teams-analytics .rail-item svg { width: 19px; height: 19px; }
#teams-analytics .workspace { min-width: 0; padding: 12px; }
#teams-analytics .toolbar { padding: 0 2px 10px; }
#teams-analytics label, #teams-analytics .dates { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
#teams-analytics select, #teams-analytics input, #teams-analytics .graph-tools button {
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
  padding: 6px 8px; border-radius: 7px; font: inherit;
}
#teams-analytics .sample { margin-left: auto; color: var(--muted); font-size: 12px; }
#teams-analytics figure {
  margin: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--panel);
}
#teams-analytics .viewport {
  position: relative; height: clamp(415px, 64vw, 530px); overflow: hidden; touch-action: none;
  cursor: grab; background-color: var(--paper);
  background-image: radial-gradient(circle, var(--dot) 0.9px, transparent 1px); background-size: 16px 16px;
}
#teams-analytics .viewport.dragging, #teams-analytics .viewport.dragging button { cursor: grabbing; }
#teams-analytics .world { position: absolute; width: 720px; height: 490px; transform-origin: 0 0; }
#teams-analytics .edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#teams-analytics .edge { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: .29; }
#teams-analytics .echo { opacity: .13; stroke-width: .8; }
#teams-analytics .edge.chosen { opacity: .82; }
#teams-analytics .node {
  --diameter: 52px;
  position: absolute; width: max-content; transform: translate(-50%, calc(var(--diameter) / -2));
  display: grid; justify-items: center; gap: 6px; padding: 0;
  border: 0; background: transparent; color: var(--ink); font: inherit; cursor: pointer;
  touch-action: none;
}
#teams-analytics .orb {
  position: relative; display: grid; place-items: center;
  width: var(--diameter); height: var(--diameter);
  background: var(--panel); border: 1.4px solid var(--accent);
  border-radius: 49% 51% 50% 50% / 51% 49% 51% 49%; font-weight: 650;
}
#teams-analytics .orb::after {
  content: ""; position: absolute; pointer-events: none; inset: 2px -2px -2px 1px; border: 1px solid var(--accent); opacity: .27;
  border-radius: 52% 48% 49% 51% / 49% 52% 48% 51%;
}
#teams-analytics .orb img {
  width: 100%; height: 100%; border-radius: inherit; object-fit: cover; pointer-events: none;
  opacity: .84;
}
#teams-analytics .orb:has(img) { background: var(--accent); }
#teams-analytics .group-portraits {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
}
#teams-analytics .group-portraits img {
  position: absolute; width: 58%; height: 58%; border: 1px solid var(--panel);
  border-radius: 50%; background: var(--panel);
}
#teams-analytics .group-portraits img:first-child { top: 11%; left: 8%; }
#teams-analytics .group-portraits img:last-child { bottom: 11%; right: 8%; }
#teams-analytics .orb svg { width: 19px; height: 19px; }
#teams-analytics .profile { --diameter: 66px; }
#teams-analytics .profile .orb { background: var(--accent); color: var(--paper); }
#teams-analytics .node[aria-pressed="true"] .orb { outline: 1px dashed var(--accent); outline-offset: 4px; }
#teams-analytics .node-label {
  background: var(--paper); padding: 1px 4px; border-radius: 3px; font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
#teams-analytics .node.is-hovered, #teams-analytics .node.is-focused { z-index: 1; }
#teams-analytics .node-count {
  display: none; position: absolute; top: -2.85em; left: 50%; transform: translateX(-50%);
  white-space: nowrap; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 7px;
  color: var(--muted); background: var(--panel); font-size: 12px; font-weight: 500; pointer-events: none;
}
#teams-analytics .viewport:not(.dragging) .node.is-hovered .node-count,
#teams-analytics .viewport:not(.dragging) .node.is-focused .node-count { display: block; }
#teams-analytics .graph-tools { position: absolute; right: 10px; bottom: 10px; gap: 4px; }
#teams-analytics .graph-tools button { cursor: pointer; min-height: 34px; min-width: 34px; white-space: nowrap; }
#teams-analytics .graph-tools span { padding: 0 4px; background: var(--panel); font-size: 12px; color: var(--muted); }
#teams-analytics figcaption, #teams-analytics .error {
  margin: 0; padding: 10px 12px; color: var(--muted); font-size: 13px;
}
#teams-analytics figcaption { border-top: 1px solid var(--rule); min-height: 41px; }
@media (max-width: 540px) {
  #teams-analytics .app-search { display: none; }
  #teams-analytics .workspace { padding: 8px; }
  #teams-analytics .sample { margin-left: 0; }
  #teams-analytics .app-body { grid-template-columns: 54px minmax(0, 1fr); }
  #teams-analytics .node-label { font-size: 21px; }
  #teams-analytics .node-count { font-size: 19px; }
}
</style>

  <header class="app-header">
    <span class="app-name">Teams Agent</span>
    <span class="app-search">Search messages, chats, and channels</span>

<script>
{
  const root = document.getElementById('teams-analytics');
  const viewport = root.querySelector('.viewport');
  const world = root.querySelector('.world');
  const edges = root.querySelector('.edges');
  const profile = root.querySelector('.profile');
  const nodes = [...root.querySelectorAll('.node:not(.profile)')];
  const portraits = [...world.querySelectorAll('.orb img')];
  world.querySelectorAll('[data-portraits]').forEach(node => {
    const members = node.dataset.portraits.split(' ').map(index => portraits[Number(index)].cloneNode());
    node.querySelector('.group-portraits').replaceChildren(...members);
  });
  const detail = root.querySelector('figcaption');
  const range = root.querySelector('select');
  const dates = root.querySelector('.dates');
  const from = dates.querySelector('[name=from]');
  const to = dates.querySelector('[name=to]');
  const error = root.querySelector('.error');
  const zoomLabel = root.querySelector('.zoom-level');
  const figure = root.querySelector('figure');
  const dayMs = 86400000;
  const first = Date.parse(from.min);
  const last = Date.parse(to.max);
  const origin = { x: 360, y: 229 };
  let center = { ...origin };
  const angles = [-2.55, -0.53, 0.75, 2.45];
  const body = position => ({ ...position, vx: 0, vy: 0 });
  const hub = body(origin);
  const satellites = nodes.map(() => body(origin));
  const links = nodes.map(() => ['edge', 'edge echo'].map(name => {
    const edge = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    edge.setAttribute('class', name);
    edges.appendChild(edge);
    return edge;
  }));
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let distances = [];
  let frame = null;
  let previousTime = null;
  let selected = profile;
  let summaries = [];
  let visible = new Set();
  let zoom = 1;
  let offset = { x: 0, y: 0 };
  let drag = null;
  let ignoreClick = false;

  function selectedDays() {
    dates.hidden = range.value !== 'custom';
    let start = Date.parse(from.value);
    const end = dates.hidden ? last : Date.parse(to.value);
    if (range.value === 'all') {
      start = first;
    } else if (dates.hidden) {
      if (range.value === 'six-months') {
        const startDate = new Date(last);
        const day = startDate.getUTCDate();
        startDate.setUTCDate(1);
        startDate.setUTCMonth(startDate.getUTCMonth() - 6);
        const endOfMonth = new Date(startDate);
        endOfMonth.setUTCMonth(startDate.getUTCMonth() + 1, 0);
        startDate.setUTCDate(Math.min(day, endOfMonth.getUTCDate()));
        start = startDate.getTime();
      } else {
        start = last - (Number(range.value) - 1) * dayMs;
      }
      from.value = new Date(start).toISOString().slice(0, 10);
      to.value = to.max;
    }
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < first || end > last || end < start) return null;
    return Array.from({ length: (end - start) / dayMs + 1 }, (_, i) => (start - first) / dayMs + i);
  }

  function updateData() {
    const days = selectedDays();
    error.hidden = days !== null;
    figure.hidden = days === null;
    if (!days) return;
    const firstLayout = summaries.length === 0;
    summaries = nodes.map((node, i) => days.reduce((stats, day) => {
      const sent = [5, 1, 4, 1][i] + (day * 3 + i * 5) % 5;
      stats.sent += sent;
      stats.total += sent + [8, 6, 4, 2][i] + (day + [1, 3, 4, 5][i]) % 5;
      return stats;
    }, { sent: 0, total: 0 }));
    visible = new Set(summaries.map((counts, i) => ({ ...counts, i }))
      .filter(({ total }) => total > 0)
      .sort((a, b) => b.sent - a.sent || b.total - a.total || a.i - b.i)
      .slice(0, 30).map(({ i }) => i));
    const maxSent = Math.max(1, ...summaries.map(value => value.sent));
    distances = summaries.map(({ sent }) => 113 + 76 * (1 - sent / maxSent));
    renderGraph();
    if (firstLayout) settleGraph();
    else wakeGraph();
    renderCamera();
  }

  function place(node, x, y) {
    node.style.left = x + 'px';
    node.style.top = y + 'px';
  }

  function renderGraph() {
    if (selected !== profile && !visible.has(nodes.indexOf(selected))) selected = profile;
    profile.setAttribute('aria-pressed', String(selected === profile));
    nodes.forEach((node, i) => {
      const { sent, total } = summaries[i];
      node.hidden = !visible.has(i);
      links[i].forEach(edge => {
        edge.toggleAttribute('hidden', node.hidden);
        edge.classList.toggle('chosen', selected === node);
      });
      node.style.setProperty('--diameter', (38 + 42 * Math.sqrt(total / 850)) + 'px');
      const name = node.querySelector('.node-label').textContent;
      const kind = node.dataset.kind || 'Direct chat';
      node.querySelector('.node-count').textContent = sent + ' sent · ' + total + ' total';
      node.setAttribute('aria-label', name + ', ' + kind + ', ' + sent + ' messages sent, ' + total + ' total messages');
      node.setAttribute('aria-pressed', String(selected === node));
      if (selected === node) detail.textContent = name + ' · ' + sent + ' sent by you · ' + total + ' total messages';
    });
    if (selected === profile) {
      const sent = summaries.reduce((sum, value) => sum + value.sent, 0);
      detail.textContent = 'My profile · ' + sent + ' messages sent';
    }
  }

  function target(i) {
    const held = drag?.target;
    if (held && drag.index === i) return held;
    const angle = angles[i];
    const distance = distances[i];
    return {
      x: hub.x + Math.cos(angle) * distance,
      y: hub.y + Math.sin(angle) * distance
    };
  }

  function dropChat(index, angle) {
    const circle = 2 * Math.PI;
    const wrap = value => (value % circle + circle) % circle;
    const visible = nodes.map((node, i) => i).filter(i => !nodes[i].hidden);
    const gap = circle / visible.length;
    const turn = wrap(angle - angles[index] + Math.PI) - Math.PI;
    const preferred = turn < 0 ? -1 : 1;
    function layout(direction) {
      const lead = Math.min(Math.abs(turn) * 0.08, gap * 0.08);
      const next = angle + direction * lead;
      const heading = Math.cos(angle) * Math.cos(next) < 0 ? angle : next;
      const neighbors = visible.filter(i => i !== index)
        .map(i => ({ i, offset: wrap((angles[i] - heading) * direction) }))
        .sort((a, b) => a.offset - b.offset);
      const skipped = neighbors.reduce((max, { offset }, rank) =>
        Math.max(max, Math.ceil((offset - 0.0001) / gap) - rank - 1), 0);
      let longest = 0;
      const positions = neighbors.map(({ i, offset }, rank) => {
        const slot = rank + skipped + 1;
        const distance = (slot + Math.floor((slot - 1) / neighbors.length)) * gap;
        longest = Math.max(longest, distance - offset);
        return { i, angle: heading + direction * distance };
      });
      positions.push({ i: index, angle: heading });
      return { positions, longest };
    }
    const first = layout(preferred);
    const other = layout(-preferred);
    const { positions } = other.longest + 0.001 < first.longest ? other : first;
    positions.forEach(({ i, angle }) => { angles[i] = angle; });
  }

  function paintGraph() {
    place(profile, hub.x, hub.y);
    satellites.forEach(({ x, y, vx, vy }, i) => {
      place(nodes[i], x, y);
      const length = Math.hypot(x - hub.x, y - hub.y) || 1;
      const normalX = (hub.y - y) / length;
      const normalY = (x - hub.x) / length;
      const sway = (0.55 * vx + 0.45 * hub.vx) * normalX + (0.55 * vy + 0.45 * hub.vy) * normalY;
      const curve = Math.max(-28, Math.min(28, -sway * 0.09));
      const midX = (hub.x + x) / 2 + curve * normalX;
      const midY = (hub.y + y) / 2 + curve * normalY;
      links[i].forEach((edge, layer) => {
        const inkOffset = layer ? 3 : -2;
        edge.setAttribute('d', 'M' + hub.x + ' ' + hub.y
          + ' Q' + (midX + inkOffset * normalX) + ' ' + (midY + inkOffset * normalY) + ' ' + x + ' ' + y);
      });
    });
  }

  function settleGraph() {
    Object.assign(hub, body(center));
    satellites.forEach((satellite, i) => Object.assign(satellite, body(target(i))));
    paintGraph();
  }

  function spring(particle, destination, stiffness, damping, dt) {
    const dx = destination.x - particle.x;
    const dy = destination.y - particle.y;
    if (Math.hypot(dx, dy) < 0.12 && Math.hypot(particle.vx, particle.vy) < 1.2) {
      Object.assign(particle, body(destination));
      return false;
    }
    const resistance = Math.exp(-damping * dt);
    particle.vx = (particle.vx + dx * stiffness * dt) * resistance;
    particle.vy = (particle.vy + dy * stiffness * dt) * resistance;
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    return true;
  }

  function animateGraph(now) {
    frame = null;
    const dt = previousTime === null ? 1 / 60 : Math.max(0, Math.min(0.025, (now - previousTime) / 1000));
    previousTime = now;
    let moving = spring(hub, center, 350, 24, dt);
    satellites.forEach((satellite, i) => {
      const held = drag?.node === nodes[i] && drag.target;
      moving = spring(satellite, target(i), held ? 440 : 115 + (i % 3) * 16, held ? 26 : 13, dt) || moving;
    });
    paintGraph();
    if (moving) wakeGraph();
    else previousTime = null;
  }

  function wakeGraph() {
    if (reducedMotion.matches) {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      previousTime = null;
      settleGraph();
    } else if (frame === null) {
      frame = requestAnimationFrame(animateGraph);
    }
  }

  function scale() {
    return Math.min(viewport.clientWidth / 475, viewport.clientHeight / 430, 1.2) * zoom;
  }

  function renderCamera() {
    const factor = scale();
    world.style.transform = 'translate(' + ((viewport.clientWidth - 720 * factor) / 2 + offset.x) + 'px, '
      + ((viewport.clientHeight - 490 * factor) / 2 + offset.y) + 'px) scale(' + factor + ')';
    zoomLabel.textContent = Math.round(100 * zoom) + '%';
  }

  function zoomAt(multiplier, x, y) {
    const previous = zoom;
    zoom = Math.max(.65, Math.min(3, zoom * multiplier));
    offset.x = x - (x - offset.x) * zoom / previous;
    offset.y = y - (y - offset.y) * zoom / previous;
    renderCamera();
  }

  function resetView() {
    zoom = 1;
    const factor = scale();
    offset = { x: (origin.x - center.x) * factor, y: (origin.y - center.y) * factor };
    renderCamera();
  }

  range.addEventListener('change', updateData);
  [from, to].forEach(input => input.addEventListener('change', updateData));
  [profile, ...nodes].forEach(node => node.addEventListener('click', () => {
    if (ignoreClick) return;
    selected = node;
    renderGraph();
  }));
  nodes.forEach(node => {
    node.addEventListener('pointerenter', () => node.classList.add('is-hovered'));
    node.addEventListener('pointerleave', () => node.classList.remove('is-hovered'));
    node.addEventListener('focus', () => node.classList.add('is-focused'));
    node.addEventListener('blur', () => node.classList.remove('is-focused'));
  });
  root.querySelector('[data-zoom=in]').addEventListener('click', () => zoomAt(1.25, 0, 0));
  root.querySelector('[data-zoom=out]').addEventListener('click', () => zoomAt(.8, 0, 0));
  root.querySelector('.fit').addEventListener('click', resetView);
  viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = viewport.getBoundingClientRect();
    zoomAt(Math.exp(-event.deltaY * .0015), event.clientX - rect.left - rect.width / 2, event.clientY - rect.top - rect.height / 2);
  }, { passive: false });
  viewport.addEventListener('pointerdown', event => {
    if (drag || event.button !== 0 || event.target.closest('.graph-tools')) return;
    const node = event.target.closest('.node');
    const index = nodes.indexOf(node);
    const particle = node === profile ? hub : satellites[index];
    drag = {
      pointerId: event.pointerId, x: event.clientX, y: event.clientY,
      offset: { ...offset }, start: particle && { x: particle.x, y: particle.y }, node, index, moved: false
    };
  });
  viewport.addEventListener('pointermove', event => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) {
      drag.moved = true;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    }
    if (!drag.node) {
      offset = { x: drag.offset.x + dx, y: drag.offset.y + dy };
      renderCamera();
    } else if (drag.node === profile) {
      const factor = scale();
      center = { x: drag.start.x + dx / factor, y: drag.start.y + dy / factor };
      wakeGraph();
    } else {
      const factor = scale();
      drag.target = { x: drag.start.x + dx / factor, y: drag.start.y + dy / factor };
      wakeGraph();
    }
  });
  function finishDrag(event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    if (drag.moved) {
      if (event.type === 'pointerup' && drag.index >= 0) {
        const factor = scale();
        const x = drag.start.x + (event.clientX - drag.x) / factor - hub.x;
        const y = drag.start.y + (event.clientY - drag.y) / factor - hub.y;
        if (Math.hypot(x, y) > 0.1) dropChat(drag.index, Math.atan2(y, x));
      }
      ignoreClick = true;
      setTimeout(() => { ignoreClick = false; }, 0);
    }
    drag = null;
    viewport.classList.remove('dragging');
    wakeGraph();
  }
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(name => viewport.addEventListener(name, finishDrag));
  viewport.addEventListener('pointerleave', event => { if (drag && !drag.moved) finishDrag(event); });
  if (typeof ResizeObserver === 'function') new ResizeObserver(renderCamera).observe(viewport);
  else window.addEventListener('resize', renderCamera);
  updateData();
}
</script>
